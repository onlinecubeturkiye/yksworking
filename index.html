<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>YKS Çalışma Platformu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">📚 YKS Çalışma</div>
    <div class="countdown" id="topCountdown"></div>
    <button class="icon-btn" id="themeToggle" title="Tema değiştir">🌓</button>
  </header>

  <nav class="tabs" id="tabs">
    <a href="#home" data-view="home">🏠 Ana Sayfa</a>
    <a href="#topics" data-view="topics">📖 Konular</a>
    <a href="#timer" data-view="timer">⏱️ Sayaç</a>
    <a href="#questions" data-view="questions">✏️ Sorular</a>
    <a href="#exams" data-view="exams">📝 Denemeler</a>
    <a href="#plan" data-view="plan">📅 Program</a>
    <a href="#mistakes" data-view="mistakes">❌ Yanlışlar</a>
    <a href="#settings" data-view="settings">⚙️ Ayarlar</a>
  </nav>

  <main id="app"></main>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" id="modalBox"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
